version: 2.1

jobs:
  build:
    docker:
      - image: rocker/r-ver:4.5.2
    working_directory: /root/repo
    steps:
      - run:
          name: Install OS dependencies
          command: |
            # Clear any stale apt cache before updating
            apt-get clean
            rm -rf /var/lib/apt/lists/*
            
            # Update package lists and install dependencies with retry logic
            for i in {1..3}; do
              apt-get update && break || if [ $i -lt 3 ]; then sleep 10; fi
            done
            
            apt-get install -y --no-install-recommends \
              build-essential gfortran gcc-13 g++-13 liblapack-dev libblas-dev \
              libxml2-dev libssl-dev libcurl4-openssl-dev libgit2-dev \
              pandoc openssh-client git python3-pip \
              libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
              fontconfig libfontconfig1-dev pkg-config
            
            rm -rf /var/lib/apt/lists/*
      - checkout
      - run:
          name: Configure compiler environment
          command: |
            # Ensure system C/C++ compilers are used (not conda-bundled versions)
            # This prevents GCC version mismatch warnings in coverage collection
            export CC=$(which gcc)
            export CXX=$(which g++)
            export FC=$(which gfortran)
            export F77=$(which gfortran)
            export GCOV=$(which gcov-13 || which gcov)
            echo "Compiler versions:"
            gcc --version | head -1
            g++ --version | head -1
            gfortran --version | head -1
            echo "Coverage tool:"
            $GCOV --version | head -1
            # Create symlink for gcov if gcov-13 exists
            if [ -f /usr/bin/gcov-13 ] && [ ! -f /usr/bin/gcov ]; then
              ln -s /usr/bin/gcov-13 /usr/bin/gcov
            fi
      - restore_cache:
          keys:
            - v1-r-packages-{{ checksum "DESCRIPTION" }}-r4.5.2
      - run:
          name: Configure R for faster package installation
          command: |
            mkdir -p ~/.config/R
            cat >> ~/.Rprofile \<<'EOF'
            # Prefer binary packages over source compilation (speeds up installation)
            options(install.packages.check.source = "no")
            # Use parallel compilation (faster vignette & package builds)
            options(Ncpus = 8)
            # Increase timeout for slow CRAN mirrors
            options(timeout = 300)
            EOF
            cat ~/.Rprofile
      - run:
          name: Install package dependencies
          command: |
            Rscript - \<<'EOF'
            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              install.packages("BiocManager", repos = "https://cloud.r-project.org")
            }
            cran_pkgs <- c("remotes", "rcmdcheck", "covr")
            install.packages(cran_pkgs, repos = "https://cloud.r-project.org")
            remotes::install_deps(dependencies = TRUE, upgrade = "never")
            EOF
          no_output_timeout: 30m
      - save_cache:
          paths:
            - /usr/local/lib/R/site-library
          key: v1-r-packages-{{ checksum "DESCRIPTION" }}-r4.5.2
      - run:
          name: Build package
          command: |
            R CMD build --compact-vignettes=both .
          no_output_timeout: 20m
      - run:
          name: Fetch tools and CI config from maintenance branch
          command: |
            set -euxo pipefail
            ORIG_URL=$(git remote get-url origin)
            if command -v ssh >/dev/null 2>&1; then
              git fetch origin maintenance || true
              git checkout origin/maintenance -- tools || true
              git checkout origin/maintenance -- .codecov.yml || true
            else
              # Convert SSH-style remote URL to HTTPS if needed
              if echo "$ORIG_URL" | grep -qE '^(git@|ssh://)'; then
                HTTPS_URL=$(echo "$ORIG_URL" | sed -E 's#^(git@|ssh://)([^:/]+)[:/](.+)$#https://\2/\3#')
              else
                HTTPS_URL="$ORIG_URL"
              fi
              # Fetch the maintenance branch from the HTTPS URL into origin/maintenance
              git fetch "$HTTPS_URL" maintenance:refs/remotes/origin/maintenance || true
              git checkout origin/maintenance -- tools || true
              git checkout origin/maintenance -- .codecov.yml || true
            fi
            chmod +x tools/*.sh || true
            find tools -type f -name '*.R' -exec chmod +x {} \; || true
      - run:
          name: Apply code formatting (if available)
          command: |
            if [ -f tools/apply_formatR.R ]; then
              echo "Running code style formatter..."
              Rscript tools/apply_formatR.R || echo "Warning: Code formatting script failed"
            else
              echo "Skipping code formatting (tools/apply_formatR.R not found)"
            fi
      - run:
          name: Run checks with parallel compilation
          command: |
            export _R_CHECK_FORCE_SUGGESTS_=false
            export NOT_CRAN=true
            R CMD check --no-manual --ignore-vignettes *.tar.gz
          no_output_timeout: 30m
      - run:
          name: Generate coverage report and upload to Codecov
          environment:
            CC: /usr/bin/gcc
            CXX: /usr/bin/g++
            FC: /usr/bin/gfortran
            F77: /usr/bin/gfortran
            NOT_CRAN: "true"
          command: |
            if [ -f tools/run_coverage.R ]; then
              # Use covr::codecov() to upload directly (includes --upload flag)
              Rscript tools/run_coverage.R --upload
            else
              echo "Warning: tools/run_coverage.R not found"
            fi
          no_output_timeout: 30m
      - store_artifacts:
          path: coverage
          destination: coverage

workflows:
  version: 2
  build_and_upload:
    jobs:
      - build
